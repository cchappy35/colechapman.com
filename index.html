document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt Garamond',serif;font-size:clamp(56px,6vw,80px);line-height:1\">{{ l2 }}<\u002Fdiv><div style=\"font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-top:12px;color:oklch(0.75 0.01 80)\">Hours of craftsmanship, approx.<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(56px,6vw,80px);line-height:1\">{{ l3 }}<\u002Fdiv><div style=\"font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-top:12px;color:oklch(0.75 0.01 80)\">Returns accepted<\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n  <section data-screen-label=\"Press\" style=\"border-top:1px solid oklch(0.26 0.007 70);padding:clamp(64px,8vw,112px) clamp(20px,4vw,56px)\">\n    <p style=\"margin:0 0 clamp(40px,5vw,64px);text-align:center;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:oklch(0.78 0.08 80)\">In the press<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));border-top:1px solid oklch(0.26 0.007 70)\">\n      <sc-for list=\"{{ press }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <figure style=\"margin:0;padding:44px 32px 44px 0;border-bottom:1px solid oklch(0.26 0.007 70);display:flex;flex-direction:column;gap:22px\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-size:30px;letter-spacing:.18em;text-transform:uppercase;font-weight:500\">{{ p.pub }}<\u002Fdiv>\n          <blockquote style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;line-height:1.3;text-wrap:pretty\">“{{ p.text }}”<\u002Fblockquote>\n        <\u002Ffigure>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:28px 0 0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:oklch(0.62 0.01 80)\">Quotes imagined, with total confidence, by Cole.<\u002Fp>\n  <\u002Fsection>\n  <section style=\"border-top:1px solid oklch(0.26 0.007 70);padding:clamp(64px,8vw,112px) clamp(20px,4vw,56px);display:flex;flex-direction:col px,8vw,112px) clamp(20px,4vw,56px);display:flex;flex-wrap:wrap;gap:56px\">\n    <div style=\"flex:1 1 300px\">\n      <p style=\"margin:0 0 20px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:oklch(0.48 0.08 75);font-weight:400\">Questions<\u002Fp>\n      <h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(48px,6vw,80px);line-height:.95\">Questions<br><span style=\"font-style:italic\">no one asked.<\u002Fspan><\u002Fh1>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-top:1px solid oklch(0.8 0.01 80);flex:2 1 480px;min-width:0\">\n      <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"6\">\n        <div style=\"border-bottom:1px solid oklch(0.8 0.01 80)\">\n          <button type=\"button\" sc-camel-on-click=\"{{ f.toggle }}\" style=\"all:unset;cursor:pointer;width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:26px 0;font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:oklch(0.16 0.005 70)\"><span>{{ f.q }}<\u002Fspan><span style=\"font-family:'Cormorant Garamond',serif;font-size:28px;letter-spacing:0;font-weight:400\">{{ f.mark }}<\u002Fspan><\u002Fbutton>\n          <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0 0 28px;font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1.3;max-width:36ch;text-wrap:pretty\">{{ f.a }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isCareers }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"L'Atelier\" style=\"padding:clamp(64px,8vw,112px) clamp(20px,4vw,56px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:56px;align-items:end;margin-bottom:clamp(48px,6vw,88px)\">\n      <div>\n        <p style=\"margin:0 0 20px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:oklch(0.78 0.08 80)\">L'Atelier · Careers<\u002Fp>\n        <h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(48px,7vw,96px);line-height:.95\">Join the house <span style=\"font-style:italic\">of one.<\u002Fspan><\u002Fh1>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;line-height:1.7;max-width:42ch;text-wrap:pretty\">Cole Chapman is selectively expanding. Every position reports to Cole. Compensation is the experience, and the experience is mostly waiting.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid oklch(0.26 0.007 70)\">\n      <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px 56px;padding:40px 0;border-bottom:1px solid oklch(0.26 0.007 70);align-items:baseline\">\n          <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:36px;line-height:1.05\">{{ r.title }}<\u002Fh2>\n          <p style=\"margin:0;font-size:16px;line-height:1.7;max-width:44ch\">{{ r.desc }}<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:oklch(0.75 0.01 80)\"><span>{{ r.where }}<\u002Fspan><span style=\"color:oklch(0.78 0.08 80)\">{{ r.pay }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:48px 0 0;font-size:14px;line-height:1.6;color:oklch(0.7 0.01 80);max-width:56ch\">To apply, think about it carefully. Applications are reviewed by Cole, eventually.<\u002Fp>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isIR }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Investisseurs\" style=\"padding:clamp(64px,8vw,112px) clamp(20px,4vw,56px)\">\n    <p style=\"margin:0 0 20px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:oklch(0.78 0.08 80)\">Relations investisseurs<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:56px;align-items:end\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:oklch(0.75 0.01 80)\">COLE.PA · Euronext Paris (in spirit)<\u002Fdiv>\n        <div style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(80px,11vw,144px);line-height:1;margin-top:12px\">€{{ priceStr }}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;margin-top:8px;color:{{ chgColor }}\">{{ chgStr }} today<\u002Fdiv>\n      <\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 300 100\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:100%;height:220px\"><polyline points=\"{{ spark }}\" fill=\"none\" stroke=\"oklch(0.78 0.08 80)\" stroke-width=\"1.2\" vector-effect=\"non-scaling-stroke\"><\u002Fpolyline><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:clamp(56px,7vw,96px);border-top:1px solid oklch(0.26 0.007 70)\">\n      <sc-for list=\"{{ figures }}\" as=\"k\" hint-placeholder-count=\"4\">\n        <div style=\"padding:32px 24px 32px 0;border-bottom:1px solid oklch(0.26 0.007 70)\"><div style=\"font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:oklch(0.75 0.01 80)\">{{ k.label }}<\u002Fdiv><div style=\"font-family:'Cormorant Garamond',serif;font-size:30px;margin-top:10px\">{{ k.value }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:56px;margin-top:clamp(56px,7vw,96px)\">\n      <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(40px,5vw,64px);line-height:1\">Letter to <span style=\"font-style:italic\">shareholders<\u002Fspan><\u002Fh2>\n      <div style=\"font-size:17px;line-height:1.75;max-width:52ch;display:flex;flex-direction:column;gap:18px;text-wrap:pretty\">\n        <p style=\"margin:0\">Dear shareholders,<\u002Fp>\n        <p style=\"margin:0\">This quarter, Cole Chapman continued to be Cole. We believe this remains our core competency.<\u002Fp>\n        <p style=\"margin:0\">We are aware of the price movements. We do not know why they happen. Shares are not for sale. We simply wanted you to know the number.<\u002Fp>\n        <p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px\">— Cole<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n\n<footer style=\"border-top:1px solid oklch(0.26 0.007 70);padding:32px clamp(20px,4vw,56px);display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:oklch(0.7 0.01 80)\"><span>© Cole Chapman MMII<\u002Fspan><span>Cole is real.<\u002Fspan><\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;liveTicker&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;volatility&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4,&quot;min&quot;:0.2,&quot;max&quot;:5,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;}}\">\nconst PAGES = [\n  { id: 'maison', label: 'Home' },\n  { id: 'temoignages', label: 'Témoignages' },\n  { id: 'questions', label: 'Questions' },\n  { id: 'atelier', label: \"L'Atelier\" },\n  { id: 'investisseurs', label: 'Investisseurs' }\n];\nconst TESTIMONIALS = [\n  { text: 'Exquisite. I think. I only saw him from across a parking lot.', who: 'A passerby' },\n  { text: 'He has a presence. Mostly in the doorway.', who: \"Former roommate's friend\" },\n  { text: \"I'd recognize him. Probably.\", who: 'Dentist' },\n  { text: 'He once said \"nice\" about my dog. I have not forgotten.', who: 'Dog owner, local park' },\n  { text: 'We matched on something once. I believe it was a group chat.', who: 'Acquaintance' },\n  { text: 'Who?', who: 'Barista, his regular location' },\n  { text: 'He returned the shopping cart. All the way.', who: 'Grocery store employee' },\n  { text: 'I am his mother. He is very handsome.', who: 'His mother' }\n];\nconst FAQS = [\n  { q: 'May I meet Cole?', a: 'By appointment, at his discretion, rarely.' },\n  { q: 'Is Cole available in other sizes?', a: 'Cole is offered in one size. It is the correct size.' },\n  { q: 'Why is the price changing?', a: 'Cole does not discuss the price.' },\n  { q: 'Is there a Cole outlet store?', a: 'There is not. Please stop asking at the mall.' },\n  { q: 'Does Cole ship internationally?', a: 'Cole has been to several countries. Shipping was not involved.' },\n  { q: 'What is the return policy?', a: 'There are no returns. There is only Cole.' },\n  { q: 'Is this website a joke?', a: 'Cole finds this question regrettable.' }\n];\nconst ROLES = [\n  { title: 'Apprentice in Standing Nearby', desc: 'Stand slightly behind Cole in photographs. Silence preferred. Posture mandatory.', where: 'On location', pay: 'The experience' },\n  { title: 'Head of Agreeing', desc: 'Nod during Cole\\u2019s opinions. Senior candidates may say “exactly.”', where: 'Remote, attentive', pay: 'Equity (emotional)' },\n  { title: 'Keeper of the Snacks', desc: 'Curate, maintain, and replenish the house collection. Reports directly to Cole.', where: 'The kitchen', pay: 'Snacks, partial' },\n  { title: 'Archivist of Group Chats', desc: 'Preserve Cole\\u2019s most important correspondence. Discretion is everything.', where: 'Confidential', pay: 'Unpaid, permanently' }\n];\nconst PRESS = [\n  { pub: 'Vogue', text: 'An honor beyond words. We have since found the words, and they are all about Cole.' },\n  { pub: 'GQ', text: 'The most important man we have ever been allowed to stand near.' },\n  { pub: 'Vanity Fair', text: 'We asked for fifteen minutes. He gave us twelve. We will be grateful for the rest of our lives.' },\n  { pub: 'Esquire', text: 'Cole Chapman is not a trend. He is the reason trends exist.' },\n  { pub: 'The New Yorker', text: 'Our editors wept. Our photographers wept. Cole remained composed.' },\n  { pub: 'Forbes', text: 'Words fail us. Cole did not.' }\n];\nclass Component extends DCLogic {\n  state = { page: 'maison', faqOpen: 0, price: 142.18, open: 142.18, hist: [], t: 0 };\n  componentDidMount() {\n    const fromHash = () => {\n      const h = location.hash.replace('#', '');\n      if (PAGES.some(p => p.id === h)) this.setState({ page: h });\n    };\n    fromHash();\n    this.onHash = fromHash;\n    window.addEventListener('hashchange', this.onHash);\n    const seed = []; let p = 140;\n    for (let i = 0; i < 60; i++) { p += (Math.random() - 0.47) * 1.6; seed.push(p); }\n    this.setState({ hist: seed, price: p, open: seed[0] });\n    this.tick = setInterval(() => {\n      if (this.props.liveTicker === false) return;\n      const vol = this.props.volatility ?? 1;\n      this.setState(s => {\n        const price = Math.max(1, s.price + (Math.random() - 0.48) * 1.2 * vol);\n        return { price, hist: [...s.hist.slice(-59), price] };\n      });\n    }, 1400);\n    this.runCounters();\n  }\n  componentWillUnmount() { clearInterval(this.tick); cancelAnimationFrame(this.raf); window.removeEventListener('hashchange', this.onHash); }\n  runCounters() {\n    cancelAnimationFrame(this.raf);\n    const start = performance.now();\n    const step = now => {\n      const t = Math.min(1, (now - start) / 2200);\n      this.setState({ t: 1 - Math.pow(1 - t, 3) });\n      if (t < 1) this.raf = requestAnimationFrame(step);\n    };\n    this.raf = requestAnimationFrame(step);\n  }\n  go(id) {\n    return () => {\n      this.setState({ page: id });\n      window.scrollTo(0, 0);\n      if (id === 'maison') this.runCounters();\n    };\n  }\n  renderVals() {\n    const { page, faqOpen, price, open, hist, t } = this.state;\n    const chg = ((price - open) / open) * 100;\n    const up = chg >= 0;\n    const n = v => Math.round(v * t).toLocaleString();\n    let spark = '';\n    if (hist.length) {\n      const lo = Math.min(...hist), hi = Math.max(...hist), r = hi - lo || 1;\n      spark = hist.map((v, i) => `${(i / (hist.length - 1)) * 300},${96 - ((v - lo) / r) * 92}`).join(' ');\n    }\n    return {\n      nav: PAGES.filter(p => p.id !== 'maison').map(p => ({\n        ...p, href: '#' + p.id, go: this.go(p.id),\n        color: page === p.id ? 'oklch(0.78 0.08 80)' : 'inherit',\n        line: page === p.id ? 'oklch(0.78 0.08 80)' : 'transparent'\n      })),\n      goHome: this.go('maison'), goTest: this.go('temoignages'), goFaq: this.go('questions'),\n      goCareers: this.go('atelier'), goIR: this.go('investisseurs'),\n      isHome: page === 'maison', isTest: page === 'temoignages', isFaq: page === 'questions',\n      isCareers: page === 'atelier', isIR: page === 'investisseurs',\n      priceStr: price.toFixed(2),\n      chgStr: `${up ? '▲' : '▼'} ${Math.abs(chg).toFixed(2)}%`,\n      chgColor: up ? 'oklch(0.78 0.08 80)' : 'oklch(0.7 0.1 25)',\n      spark,\n      l1: n(1), l2: n(262800), l3: '0',\n      testimonials: TESTIMONIALS,\n      press: PRESS,\n      faqs: FAQS.map((f, i) => ({ ...f, open: faqOpen === i, mark: faqOpen === i ? '–' : '+',\n        toggle: () => this.setState({ faqOpen: faqOpen === i ? -1 : i }) })),\n      roles: ROLES,\n      figures: [\n        { label: 'Market cap', value: 'One Cole' },\n        { label: 'Dividend', value: 'Occasional texts' },\n        { label: 'P/E ratio', value: 'Unclear' },\n        { label: 'Shares outstanding', value: '1 (not for sale)' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
